name: XN1Finance Same-Digest Main Promotion

on:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: finance-main-promotion-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify-development-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_SHA: ${{ github.sha }}
      DEVELOPMENT_WORKFLOW: finance-development.yml
      DEVELOPMENT_EVIDENCE: finance-development-image-evidence
      IMAGE_NAME: ghcr.io/kursav/xn1lab-xn1finance-portfolio-analytics-dev
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_SHA }}

      - name: Refuse a non-main or non-head promotion
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags origin refs/heads/develop:refs/remotes/origin/develop
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Locate successful development image evidence for the same source tree
        id: development-run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target_tree="$(git rev-parse "${TARGET_SHA}^{tree}")"
          run_id=''
          source_sha=''
          while read -r candidate_run candidate_sha; do
            test -n "$candidate_run"
            test "$candidate_sha" = "$(git rev-parse --verify "$candidate_sha^{commit}")"
            if test "$(git rev-parse "$candidate_sha^{tree}")" = "$target_tree"; then
              run_id="$candidate_run"
              source_sha="$candidate_sha"
              break
            fi
          done < <(gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/${DEVELOPMENT_WORKFLOW}/runs?event=push&status=completed&branch=develop&per_page=100" \
            --jq '.workflow_runs[] | select(.conclusion == "success" and .head_branch == "develop") | "\(.id) \(.head_sha)"')
          test -n "$run_id"
          test -n "$source_sha"
          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          printf 'target_tree=%s\n' "$target_tree" >> "$GITHUB_OUTPUT"

      - name: Download immutable development evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.DEVELOPMENT_EVIDENCE }}
          path: artifacts/development-evidence
          run-id: ${{ steps.development-run.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify equivalent source tree, image digest, and provenance without rebuilding
        shell: pwsh
        env:
          DEVELOPMENT_RUN_ID: ${{ steps.development-run.outputs.run_id }}
        run: |
          ./tools/ci/Verify-FinanceSameDigestPromotion.ps1 `
            -ReceiptPath artifacts/development-evidence/finance-development-image.json `
            -ExpectedSourceSha ${{ steps.development-run.outputs.source_sha }} `
            -ExpectedTargetSha $env:TARGET_SHA `
            -ExpectedTargetTreeSha ${{ steps.development-run.outputs.target_tree }} `
            -ExpectedRepository $env:GITHUB_REPOSITORY `
            -ExpectedWorkflowPath .github/workflows/finance-development.yml `
            -ExpectedRunId $env:DEVELOPMENT_RUN_ID `
            -ExpectedImage $env:IMAGE_NAME

      - name: Record verified immutable input
        shell: bash
        run: |
          set -euo pipefail
          jq -r '.artifact.reference' artifacts/development-evidence/finance-development-image.json >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Main source tree exactly matches the successful development source tree. No build and no deployment run on main. A separately authorized production gate must consume this exact verified OCI reference.' >> "$GITHUB_STEP_SUMMARY"
