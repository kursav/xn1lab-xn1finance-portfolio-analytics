name: Repository Governance

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-repository-governance:
    name: verify-repository-governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository governance baseline
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s .github/CODEOWNERS
          grep -Eq '(^|[[:space:]])@kursav([[:space:]]|$)' .github/CODEOWNERS
          if git ls-files | grep -Eq '(^|/)\.git($|/)'; then
            echo 'Tracked nested Git metadata is forbidden.' >&2
            exit 1
          fi
